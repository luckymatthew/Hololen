<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>hBP09-038 Blacksmith Browser Audit</title>
    <style>body{max-width:760px;margin:2rem auto;padding:0 1rem;font:16px/1.5 system-ui,sans-serif}button{padding:.7rem 1rem}#status{font-weight:700}pre{overflow:auto;background:#f2f4f8;padding:1rem}</style>
  </head>
  <body>
    <h1>hBP09-038 Blacksmith Browser Audit</h1>
    <p>Uses the current website action path to check Tool attachment scope, conditional draw, ordinary Collab Holo Power, and Arts.</p>
    <p id="status" role="status">Loading current catalogue…</p>
    <button id="run" type="button">Run hBP09-038 cases</button>
    <pre id="result" aria-live="polite"></pre>
    <script>
      addEventListener('error', event => {
        document.querySelector('#status').textContent = `FAIL loading browser audit: ${event.message || 'module load error'} ${event.filename || ''}`;
      });
      addEventListener('unhandledrejection', event => {
        document.querySelector('#status').textContent = `FAIL loading browser audit: ${String(event.reason?.stack || event.reason)}`;
      });
    </script>
    <script type="module" src="./effect-audit-hbp09-038.mjs"></script>
  </body>
</html>
