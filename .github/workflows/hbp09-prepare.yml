name: Prepare hBP09 card database sources
on:
  push:
    branches: [codex/hbp09-database-20260917]
    paths: [.github/workflows/hbp09-prepare.yml]
permissions:
  actions: read
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hbp09-official-evidence
          path: evidence
          github-token: ${{ github.token }}
          run-id: 35220916864
      - run: python -m pip install beautifulsoup4==4.13.5 json5==0.12.1 pillow==11.3.0
      - name: Extract primary-source fields and reading translations
        run: |
          python - <<'PY'
          import concurrent.futures, hashlib, io, json, pathlib, re, urllib.parse, urllib.request
          from bs4 import BeautifulSoup
          from PIL import Image
          import json5
          root=pathlib.Path('website/scripts'); media=pathlib.Path('hbp09-media/card-art');media.mkdir(parents=True)
          origin='https://hololive-official-cardgame.com'
          records=[]; samples={}
          for file in sorted(pathlib.Path('evidence/raw').glob('*.html')):
              soup=BeautifulSoup(file.read_text(),'html.parser')
              for li in soup.select('li.ex-item'):
                  number=li.select_one('p.number'); name=li.select_one('p.name')
                  if not number or not name: continue
                  info={}
                  for dl in li.select('.info dl'):
                      for dt in dl.find_all('dt',recursive=False):
                          dd=dt.find_next_sibling('dd')
                          info[dt.get_text(strip=True)]={'text':dd.get_text(' ',strip=True),'images':[dict(x.attrs) for x in dd.find_all('img')]} if dd else {}
                  img=li.select_one('div.img img'); a=li.find('a')
                  row={'number':number.get_text(strip=True),'name':name.get_text(strip=True),'image':urllib.parse.urljoin(origin,img['src']),'sourceUrl':urllib.parse.urljoin(origin,a['href']),'info':info,'fields':[]}
                  for div in li.find_all('div'):
                      classes=div.get('class',[])
                      if not any(c in classes for c in ['skill','arts','keyword','extra','ability']):continue
                      fields={'class':' '.join(classes),'html':str(div),'text':div.get_text(' ',strip=True)}
                      row['fields'].append(fields)
                      samples.setdefault(fields['class'],str(div))
                  records.append(row)
          assert len(records)==255,len(records)
          assert len({r['image'] for r in records})==255
          assert len({r['number'] for r in records})==131
          (root/'hbp09-official.json').write_text(json.dumps({'product':'ボリュームヴォルテックス','releaseDate':'2026-09-19','productUrl':origin+'/products/post/volume-vortex/','snapshotDate':'2026-09-17','printings':records},ensure_ascii=False,indent=2))
          def fetch(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Hololens-hBP09/1.0'}),timeout=60) as r:return r.read()
          page=fetch('https://tetsunekko.github.io/holotcgtw/').decode()
          scripts=re.findall(r'<script[^>]+src=[\"\']([^\"\']+)',page)
          translations=[]; provenance=[]; matching=[]
          for script in scripts:
              url=urllib.parse.urljoin('https://tetsunekko.github.io/holotcgtw/',script)
              data=fetch(url);text=data.decode()
              provenance.append({'url':url,'sha256':hashlib.sha256(data).hexdigest()})
              for m in re.finditer(r'\{id:\s*[\"\']hBP09-',text):
                  start=m.start();depth=0;quote=None;escape=False;end=None
                  for i in range(start,len(text)):
                      c=text[i]
                      if quote:
                          if escape:escape=False
                          elif c=='\\':escape=True
                          elif c==quote:quote=None
                      elif c in '\"\'':quote=c
                      elif c=='{':depth+=1
                      elif c=='}':
                          depth-=1
                          if depth==0:end=i+1;break
                  if end:
                      snippet=text[start:end]
                      try:translations.append(json5.loads(snippet))
                      except Exception as error:matching.append({'error':str(error),'snippet':snippet[:300]})
              if 'hBP09' in text and not translations:matching.append({'context':text[max(0,text.find('hBP09')-200):text.find('hBP09')+1000]})
          (root/'hbp09-source.json').write_text(json.dumps({'provenance':provenance,'cards':translations},ensure_ascii=False,indent=2))
          inspect={'officialCount':len(records),'classes':samples,'translationCount':len(translations),'translationSamples':translations[:2],'translationErrors':matching[:3],'infoSamples':[{k:v for k,v in r.items() if k!='fields'} for r in records[:4]]}
          pathlib.Path('website/docs/hbp09-source-inspection.json').write_text(json.dumps(inspect,ensure_ascii=False,indent=2))
          def image(row):
              data=fetch(row['image'])
              img=Image.open(io.BytesIO(data));img.load()
              assert img.width>=300 and img.height>=400,(row['image'],img.size)
              imagepath='hbp09-'+hashlib.sha256(row['image'].encode()).hexdigest()[:20]+'.webp'
              img.convert('RGB').save(media/imagepath,'WEBP',quality=92,method=6)
              return {'url':row['image'],'path':'/card-art/'+imagepath,'sha256':hashlib.sha256((media/imagepath).read_bytes()).hexdigest(),'width':img.width,'height':img.height}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:images=list(pool.map(image,records))
          pathlib.Path('hbp09-media/art-manifest.json').write_text(json.dumps(images,ensure_ascii=False,indent=2))
          print(json.dumps({'officialPrintings':len(records),'translations':len(translations),'images':len(images)}))
          PY
      - name: Commit source snapshots on isolated update branch
        run: |
          git config user.name 'Hololens Database Update'
          git config user.email '108892610+luckymatthew@users.noreply.github.com'
          git add website/scripts/hbp09-official.json website/scripts/hbp09-source.json website/docs/hbp09-source-inspection.json
          git diff --cached --quiet || git commit -m 'Capture 255 official hBP09 printings with translation provenance'
          git push origin HEAD:codex/hbp09-database-20260917
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hbp09-offline-media
          path: hbp09-media/
          retention-days: 14
