name: Test executable hBP09 effects
on:
  push:
    branches: [codex/hbp09-executable-effects-20260918]
    paths:
      - .github/workflows/hbp09-effects-test.yml
      - website/lib/simulator/hbp09/**
      - website/scripts/apply-hbp09-effects.py
      - website/scripts/hbp09-test-contracts.py
      - website/scripts/package-hbp09-effects.py
      - website/tests/hbp09*.mjs
permissions:
  contents: read
concurrency:
  group: hbp09-effects-tests
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Check committed executable sources
        run: |
          mkdir -p hbp09-results
          for file in website/lib/simulator/hbp09/*.mjs; do node --check "$file"; done
          python -m py_compile website/scripts/apply-hbp09-effects.py website/scripts/hbp09-test-contracts.py
      - name: Apply exact integration and check repeat safety
        run: |
          python website/scripts/apply-hbp09-effects.py --apply > hbp09-results/integration.json
          node --check website/lib/simulator/engine.mjs
          node --check website/lib/simulator/effect-catalog.mjs
          python website/scripts/apply-hbp09-effects.py --apply > hbp09-results/integration-repeat.json
      - name: Run real hBP09 state-transition tests
        working-directory: website
        run: |
          node --test tests/hbp09-executable.test.mjs > ../hbp09-results/executable-tests.txt 2>&1 || { cat ../hbp09-results/executable-tests.txt; exit 1; }
          tail -15 ../hbp09-results/executable-tests.txt
      - name: Install project dependencies
        working-directory: website
        run: npm ci
      - name: Full regression, TypeScript and production build
        working-directory: website
        run: |
          npm test > ../hbp09-results/full-regression.txt 2>&1 || { tail -80 ../hbp09-results/full-regression.txt; exit 1; }
          tail -30 ../hbp09-results/full-regression.txt
      - name: Build and verify native-reference parity
        working-directory: website
        run: |
          mkdir -p ../hbp09-results/native-reference
          ./node_modules/.bin/esbuild lib/simulator/engine.mjs --bundle --format=iife --global-name=HololensHbp09Rules --target=es2020 --outfile=../hbp09-results/native-reference/hbp09-rules.iife.js
          node tests/hbp09-native-parity.mjs > ../hbp09-results/native-parity.json
      - name: Package and retest the self-contained reference
        run: python website/scripts/package-hbp09-effects.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hbp09-executable-test-records
          path: hbp09-results/
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Hololens-hBP09-Executable-Effects
          path: hbp09-package/
          if-no-files-found: error
          retention-days: 14
