plugins { id 'com.android.application' }

android {
    namespace 'com.holocard.scanner'
    compileSdk 36
    defaultConfig {
        // New preview identity permits side-by-side installation with the user's working 0.1 build.
        applicationId 'com.holocard.pocketlab'
        minSdk 35
        targetSdk 36
        versionCode (project.findProperty('releaseVersionCode') ?: '4').toInteger()
        versionName project.findProperty('releaseVersion') ?: '0.2.2-preview'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        if (System.getenv('HOLO_RELEASE_KEYSTORE')) {
            production {
                storeFile file(System.getenv('HOLO_RELEASE_KEYSTORE'))
                storePassword System.getenv('HOLO_RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('HOLO_RELEASE_KEY_ALIAS')
                keyPassword System.getenv('HOLO_RELEASE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('HOLO_RELEASE_KEYSTORE')) signingConfig signingConfigs.production
        }
    }
    // An existing preview key can be supplied locally; never package it in source/APK artifacts.
    if (System.getenv('HOLO_PREVIEW_KEYSTORE')) {
        signingConfigs.debug.storeFile = file(System.getenv('HOLO_PREVIEW_KEYSTORE'))
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging { jniLibs { useLegacyPackaging false } }
    splits { abi { enable true; reset(); include 'arm64-v8a', 'x86_64'; universalApk false } }
    androidResources { noCompress 'bin' }
    testOptions { unitTests.returnDefaultValues = true }
}

dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.camera:camera-core:1.5.3'
    implementation 'androidx.camera:camera-camera2:1.5.3'
    implementation 'androidx.camera:camera-lifecycle:1.5.3'
    implementation 'androidx.camera:camera-view:1.5.3'
    implementation 'androidx.exifinterface:exifinterface:1.4.1'
    implementation 'androidx.webkit:webkit:1.13.0'
    implementation 'com.google.mlkit:text-recognition-japanese:16.0.1'
    implementation 'org.opencv:opencv:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250107'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
