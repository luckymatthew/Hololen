name: Prepare signed Android release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 0.2.3 (no v prefix)'
        required: true
      version_code:
        description: 'Android versionCode, greater than every previous release (current 4)'
        required: true
permissions:
  contents: write
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  release:
    # The supplied 0.7.2 APK has newer source and a different applicationId.
    # Import that matching source and signing key before enabling this build.
    if: vars.ANDROID_SOURCE_READY == 'true'
    runs-on: ubuntu-latest
    environment: android-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Validate deliberate release inputs
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CODE: ${{ inputs.version_code }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ "$RELEASE_CODE" =~ ^[0-9]+$ ]] && (( RELEASE_CODE > 4 )) || exit 1
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore signing key into runner temporary storage
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Configure signing secrets first.'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hololens-release.jks"
      - name: Build signed APK
        working-directory: mobile/HoloCardScanner
        env:
          HOLO_RELEASE_KEYSTORE: ${{ runner.temp }}/hololens-release.jks
          HOLO_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          HOLO_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HOLO_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CODE: ${{ inputs.version_code }}
        run: |
          test -n "$HOLO_RELEASE_STORE_PASSWORD" && test -n "$HOLO_RELEASE_KEY_ALIAS" && test -n "$HOLO_RELEASE_KEY_PASSWORD"
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease -PreleaseVersion="$RELEASE_VERSION" -PreleaseVersionCode="$RELEASE_CODE"
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "$RUNNER_TEMP/HoloLens.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$RUNNER_TEMP/HoloLens.apk"
      - name: Create reviewable draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then echo 'Release already exists. Use a new version.'; exit 1; fi
          gh release create "v$RELEASE_VERSION" "$RUNNER_TEMP/HoloLens.apk" --draft --target "$GITHUB_SHA" --title "HoloLens $RELEASE_VERSION" --generate-notes
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/hololens-release.jks"
