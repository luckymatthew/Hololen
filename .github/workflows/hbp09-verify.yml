name: Verify and package hBP09 databases
on:
  push:
    branches: [codex/hbp09-database-20260917]
    paths:
      - .github/workflows/hbp09-verify.yml
      - website/scripts/merge-hbp09.py
      - website/tests/hbp09.test.py
permissions:
  actions: read
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: python -m pip install beautifulsoup4==4.13.5
      - name: Import and validate all hBP09 cards
        run: |
          mkdir -p qa-hbp09
          cp website/public/cards.json qa-hbp09/baseline-cards.json
          python website/scripts/merge-hbp09.py
          HBP09_BASELINE="$PWD/qa-hbp09/baseline-cards.json" python website/tests/hbp09.test.py 2>&1 | tee qa-hbp09/database-tests.txt
      - name: Install website dependencies
        working-directory: website
        run: npm ci
      - name: Website tests, type check and production build
        working-directory: website
        run: npm test 2>&1 | tee ../qa-hbp09/website-tests.txt
      - uses: actions/download-artifact@v4
        with:
          name: hbp09-inputs
          path: baseline-inputs
          github-token: ${{ github.token }}
          run-id: 35221158448
      - name: Build native database files without changing any executable code
        run: |
          python - <<'PY'
          import copy,hashlib,importlib.util,json,pathlib,shutil,zipfile
          root=pathlib.Path('website');spec=importlib.util.spec_from_file_location('hbp09',root/'scripts/merge-hbp09.py');m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          apk=pathlib.Path('baseline-inputs/published-1.1.0.apk')
          if hashlib.sha256(apk.read_bytes()).hexdigest()!='fe7e54bb60468eba7d27ae97a7f99a528c86d5b618f4ec0e09571f298258b2a5':raise ValueError('Public APK baseline mismatch')
          delta=m.load(root/'public/hbp09-cards.json');images=m.load(root/'scripts/hbp09-art-manifest.json');art={r['url']:r['path'] for r in images};japanese=m.load(root/'public/hbp09-scanner-ja.json')
          out=pathlib.Path('hbp09-deliverables');assets=out/'android-assets';report={'baseline':'Hololens 1.1.0 public APK','catalogVersion':m.VERSION,'apkRebuilt':False,'executableCodeModified':False,'images':len(images),'databases':{}}
          with zipfile.ZipFile(apk) as z:
              for rel in ['cards.json','app/offline-cards.json','native/firebase-cards.json']:
                  old=json.loads(z.read('assets/'+rel));new,stats=m.merge(old,delta,art if rel=='app/offline-cards.json' else None)
                  again,repeat=m.merge(new,delta,art if rel=='app/offline-cards.json' else None)
                  if again!=new:raise ValueError('Non-idempotent Android data update')
                  m.dump(assets/rel,new);report['databases'][rel]=stats
                  before={c['number']:c for c in old['cards']};after={c['number']:c for c in new['cards']}
                  for n,c in before.items():
                      if after[n]['id']!=c['id']:raise ValueError('Android card identity changed')
              mapping=json.loads(z.read('assets/art-map.json'));mapping.update(art);m.dump(assets/'art-map.json',mapping)
              scanner=json.loads(z.read('assets/scanner-ja.json'))
              for n,r in japanese.items():
                  previous=scanner['cards'].get(n,{})
                  scanner['cards'][n]={**previous,**{k:list(dict.fromkeys(previous.get(k,[])+r[k])) for k in ['titles','effects']}}
              scanner.setdefault('meta',{})['hbp09CatalogVersion']=m.VERSION;m.dump(assets/'scanner-ja.json',scanner)
              report['preservedEngineSha256']={p:hashlib.sha256(z.read(p)).hexdigest() for p in z.namelist() if p.endswith('.dex') or p in ['assets/native/engine.js','assets/native/firebase-rules.js']}
          for image in images:
              source=root/'public'/image['path'].lstrip('/');target=assets/image['path'].lstrip('/');target.parent.mkdir(parents=True,exist_ok=True)
              if hashlib.sha256(source.read_bytes()).hexdigest()!=image['sha256']:raise ValueError('Artwork hash mismatch')
              shutil.copy2(source,target)
          m.dump(out/'android-data-verification.json',report)
          for rel in ['cards.json','scanner-ja.json','hbp09-cards.json','hbp09-scanner-ja.json']:
              target=out/'website-public'/rel;target.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(root/'public'/rel,target)
          shutil.copytree(root/'dist-firebase',out/'website-build')
          shutil.copytree('qa-hbp09',out/'verification')
          shutil.copy2(root/'docs/hbp09-import-report.json',out/'verification/hbp09-import-report.json')
          (out/'README.txt').write_text('hBP09 database update, 2026-09-17\n\n255 official printings; release date 2026-09-19. New effects retain official Japanese originals, not a completed Traditional Chinese translation.\n\nwebsite-build: verified Firebase Hosting production build; NOT yet deployed.\nandroid-assets: DATA FILES ONLY for public Hololens 1.1.0 source app/src/main/assets. No APK is rebuilt or signed. Preserve the existing Java/Kotlin/DEX/native engine and original signing key. For a newer AI Lab source, merge the hBP09 release delta into its existing databases instead of replacing unrelated data.\n\nNo signing key or password is included. New card gameplay effects and real-device operation have not been audited by this database update.\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Commit verified catalog data
        run: |
          git config user.name 'Hololens Database Update'
          git config user.email '108892610+luckymatthew@users.noreply.github.com'
          git add website/public/cards.json website/public/scanner-ja.json website/public/hbp09-cards.json website/public/hbp09-scanner-ja.json website/docs/hbp09-import-report.json
          git diff --cached --quiet || git commit -m 'Add complete hBP09 catalog: 255 printings with preserved deck IDs'
          git pull --rebase origin codex/hbp09-database-20260917
          git push origin HEAD:codex/hbp09-database-20260917
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hbp09-database-update
          path: |
            hbp09-deliverables/
            qa-hbp09/
          retention-days: 14
